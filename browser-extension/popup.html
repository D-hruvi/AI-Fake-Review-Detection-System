<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; font-family: -apple-system, sans-serif; padding: 16px; background:#14171F; color:#E7E4DA; }
  h1 { font-size: 14px; margin: 0 0 4px; letter-spacing: 0.03em; }
  p { font-size: 12px; color: #8A8F9C; line-height: 1.4; margin: 0 0 14px; }
  label { font-size: 11px; color: #8A8F9C; display:block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #2A2F3D; background: #1C202B; color: #E7E4DA; font-size: 12px; margin-bottom: 10px; }
  button { width: 100%; padding: 9px; border: none; border-radius: 6px; background: #B8451F; color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
  #status { font-size: 11px; margin-top: 8px; color: #6FBFA0; }
</style>
</head>
<body>
  <h1>VERDICT</h1>
  <p>Point this at your deployed Verdict backend. On supported Amazon/Flipkart pages, reviews get tagged inline as you browse.</p>
  <label for="apiBase">API base URL</label>
  <input id="apiBase" type="text" placeholder="https://your-app.onrender.com">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
